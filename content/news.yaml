# 手動ニュース
# researchmap に登録した論文・発表・受賞は自動でニュースになります。
# それ以外（メディア掲載、採択、イベント告知など）はここに追記してください。
#
# 書き方:
# - date: 2026-11-04          # YYYY-MM-DD または YYYY-MM
#   kind: other               # paper / talk / award / other
#   text:
#     ja: 日本語の本文
#     en: English text        # 省略すると英語版では日本語が表示されます
#   url: https://...          # 任意
#   image: assets/img/news/xxx.jpg   # 任意
#
# 自動ニュースを隠したい場合は content/overrides.yaml の news_hide に業績IDを書きます。

- date: 2026-11-04
  kind: other
  text:
    ja: ホームページをリニューアルしました。業績は researchmap から自動で更新されます。
    en: This website has been renewed. Publications are updated automatically from researchmap.
